<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">TRB ring and the cycle bit</title>
  <desc id="d">A ring of transfer request blocks. The producer sets the cycle bit as it writes entries; on wrap the bit flips, so stale entries no longer match and the consumer skips them.</desc>
  <style>
    .cell { fill: #12151a; stroke: #232a33; stroke-width: 1.2; }
    .cur { fill: #1a2740; stroke: #6ea8fe; stroke-width: 1.7; }
    .stale { fill: #101215; stroke: #22262c; stroke-width: 1.2; }
    .trb { fill: #d7dee6; font: 12px ui-monospace, monospace; }
    .trbs { fill: #8b96a3; font: 11px ui-monospace, monospace; }
    .trbd { fill: #4f5862; font: 11px ui-monospace, monospace; }
    .lbl { fill: #d7dee6; font: 600 13px system-ui, sans-serif; }
    .note { fill: #8b96a3; font: 11px system-ui, sans-serif; }
    .cap { fill: #8b96a3; font: 10px ui-monospace, monospace; }
    .arrow { stroke: #6ea8fe; stroke-width: 1.4; fill: none; }
  </style>

  <text class="lbl" x="28" y="30">Pass one — producer writes with cycle = 1</text>

  <rect class="cur" x="28" y="44" width="92" height="46" rx="3"/>
  <text class="trb" x="44" y="64">TRB 0</text><text class="trbs" x="44" y="80">C=1</text>

  <rect class="cell" x="128" y="44" width="92" height="46" rx="3"/>
  <text class="trb" x="144" y="64">TRB 1</text><text class="trbs" x="144" y="80">C=1</text>

  <rect class="cell" x="228" y="44" width="92" height="46" rx="3"/>
  <text class="trb" x="244" y="64">TRB 2</text><text class="trbs" x="244" y="80">C=1</text>

  <rect class="cell" x="328" y="44" width="92" height="46" rx="3"/>
  <text class="trb" x="344" y="64">TRB 3</text><text class="trbs" x="344" y="80">C=1</text>

  <rect class="stale" x="428" y="44" width="92" height="46" rx="3"/>
  <text class="trbd" x="444" y="64">TRB 4</text><text class="trbd" x="444" y="80">C=1</text>

  <rect class="stale" x="528" y="44" width="92" height="46" rx="3"/>
  <text class="trbd" x="544" y="64">TRB 5</text><text class="trbd" x="544" y="80">C=1</text>

  <rect class="stale" x="628" y="44" width="92" height="46" rx="3"/>
  <text class="trbd" x="644" y="64">TRB 6</text><text class="trbd" x="644" y="80">C=1</text>

  <rect class="stale" x="728" y="44" width="92" height="46" rx="3"/>
  <text class="trbd" x="744" y="64">TRB 7</text><text class="trbd" x="744" y="80">C=1</text>

  <text class="note" x="432" y="112">written</text>
  <text class="note" x="628" y="112">not yet written — the producer</text>
  <text class="note" x="628" y="126">has not reached these slots</text>

  <!-- wrap -->
  <path class="arrow" d="M824 96 C 868 140, 76 140, 32 96" marker-end="url(#b)"/>
  <text class="note" x="356" y="150">ring wraps: the cycle bit flips</text>

  <text class="lbl" x="28" y="186">Pass two — the same slots, cycle = 0</text>

  <rect class="cur" x="28" y="200" width="92" height="46" rx="3"/>
  <text class="trb" x="44" y="220">TRB 0</text><text class="trbs" x="44" y="236">C=0</text>

  <rect class="cell" x="128" y="200" width="92" height="46" rx="3"/>
  <text class="trb" x="144" y="220">TRB 1</text><text class="trbs" x="144" y="236">C=0</text>

  <rect class="stale" x="228" y="200" width="92" height="46" rx="3"/>
  <text class="trbd" x="244" y="220">TRB 2</text><text class="trbd" x="244" y="236">C=1</text>

  <rect class="stale" x="328" y="200" width="92" height="46" rx="3"/>
  <text class="trbd" x="344" y="220">TRB 3</text><text class="trbd" x="344" y="236">C=1</text>

  <text class="note" x="440" y="216">C=0 entries are new work.</text>
  <text class="note" x="440" y="232">C=1 entries are leftovers from</text>
  <text class="note" x="440" y="248">the previous pass, already handled.</text>

  <text class="cap" x="28" y="290">The producer sets the bit as it writes. The consumer keeps its own copy and flips it on wrap.</text>
  <text class="cap" x="28" y="308">Nothing is ever cleared — a stale entry simply stops matching, which is why the bookkeeping</text>
  <text class="cap" x="28" y="326">must be exact: a wrong bit makes the controller read garbage or stop on a dead slot.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6ea8fe"/>
    </marker>
  </defs>
</svg>
