<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">xHCI MMIO register layout</title>
  <desc id="d">A memory-mapped aperture divided into capability, operational, runtime and doorbell regions. The capability registers hold the offsets to the other three.</desc>
  <style>
    .box { fill: #12151a; stroke: #3f5f8f; stroke-width: 1.5; }
    .lbl { fill: #d7dee6; font: 600 14px system-ui, sans-serif; }
    .sub { fill: #8b96a3; font: 11px ui-monospace, monospace; }
    .off { fill: #6ea8fe; font: 11px ui-monospace, monospace; font-weight: 600; }
    .cap { fill: #8b96a3; font: 10px ui-monospace, monospace; }
    .arrow { stroke: #6ea8fe; stroke-width: 1.3; fill: none; }
  </style>

  <text class="cap" x="28" y="26">BAR0 — base of the controller's MMIO aperture</text>

  <!-- Capability -->
  <rect class="box" x="28" y="40" width="220" height="86" rx="4"/>
  <text class="lbl" x="44" y="66">Capability</text>
  <text class="sub" x="44" y="86">CAPLENGTH</text>
  <text class="sub" x="44" y="102">HCSPARAMS1 / HCSPARAMS2</text>
  <text class="sub" x="44" y="118">HCCPARAMS1 · RTSOFF · DBCS</text>

  <!-- Operational -->
  <rect class="box" x="330" y="40" width="220" height="86" rx="4"/>
  <text class="lbl" x="346" y="66">Operational</text>
  <text class="sub" x="346" y="86">USBCMD · USBSTS</text>
  <text class="sub" x="346" y="102">PORTSC[1..n]</text>
  <text class="sub" x="346" y="118">CONFIG</text>

  <path class="arrow" d="M248 78 L322 78" marker-end="url(#a)"/>
  <text class="off" x="256" y="70">CAPLENGTH</text>

  <!-- Runtime -->
  <rect class="box" x="330" y="180" width="220" height="86" rx="4"/>
  <text class="lbl" x="346" y="206">Runtime (interrupter 0)</text>
  <text class="sub" x="346" y="226">IMAN · IMOD</text>
  <text class="sub" x="346" y="242">ERSTSZ · ERSTBA</text>
  <text class="sub" x="346" y="258">ERDP</text>

  <path class="arrow" d="M440 126 L440 172" marker-end="url(#a)"/>
  <text class="off" x="448" y="154">RTSOFF</text>

  <!-- Doorbell -->
  <rect class="box" x="330" y="300" width="220" height="66" rx="4"/>
  <text class="lbl" x="346" y="326">Doorbell array</text>
  <text class="sub" x="346" y="346">DB[slot] — one per slot + DB[0]</text>

  <path class="arrow" d="M440 266 L440 292" marker-end="url(#a)"/>
  <text class="off" x="448" y="282">DBCS</text>

  <!-- annotations -->
  <text class="sub" x="600" y="66">read-only: what the</text>
  <text class="sub" x="600" y="82">controller can do, and</text>
  <text class="sub" x="600" y="98">where everything else lives</text>

  <text class="sub" x="600" y="206">command/status, port states,</text>
  <text class="sub" x="600" y="222">and the run/stop bit</text>

  <text class="sub" x="600" y="326">write to submit queued work</text>
  <text class="sub" x="600" y="342">to a slot's endpoint</text>

  <text class="cap" x="28" y="398">Offsets come from the capability registers rather than being hard-coded, so the same driver survives across implementations.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6ea8fe"/>
    </marker>
  </defs>
</svg>
